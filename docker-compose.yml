services:
  gateway:
    build: ./gateway # Path to Go gateway code
    container_name: go_gateway
    ports:
      - "8080:8080" # Expose port 8080 for the Go reverse proxy
    depends_on:
      - origin # Now depends on the Python server (instead of scorer)
    environment:
      - ORIGIN_URL=http://origin:3000 # The Python server will be the origin for the proxy
    volumes:
      - ./certs:/app/certs

  origin:
    build: ./test_server # Path to the Python server code
    container_name: test_server
    ports:
      - "3000:3000" # Expose port 3000 for the Python server
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  ml_scorer:
    build:
      context: ./ml_scorer # path to folder containing Dockerfile
    container_name: ml_scorer
    volumes:
      - ./ml_scorer:/app # live code reload in container
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
