services:
  # Go Reverse Proxy Service
  go_gateway:
    build: ./gateway
    container_name: go_gateway
    ports:
      - "8080:8080"
    depends_on:
      origin:
        condition: service_healthy # Wait for Python to be ready
    environment:
      - MONGO_URI=${MONGO_URI}
      - ORIGIN_URL=http://origin:3000
      - SCORER_URL=http://ml_scorer:8000

  # Python Backend Service
  origin:
    build: ./test_server
    container_name: test_server
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      # Switched to wget for better compatibility with slim images
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # NGINX Reverse Proxy Service
  nginx:
    image: nginx:latest
    container_name: nginx_reverse_proxy
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - go_gateway
    volumes:
      # Changed to default.conf to avoid breaking root config
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./certs:/etc/ssl/certs
      # Removed redundant mount unless you have specific structure requirements
    restart: always

  ml_scorer:
    build: ./ml_scorer
    container_name: ml_scorer
    ports:
      - "8000:8000"
    restart: unless-stopped
