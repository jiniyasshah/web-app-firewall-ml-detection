#  Auto-scale workers to match CPU cores
worker_processes auto;

# Increase file descriptor limit (Critical for high concurrency)
worker_rlimit_nofile 65535;

events {
    # Allow thousands of simultaneous connections per worker
    worker_connections 4096;
    # Optimized connection processing for Linux
    use epoll;
    # Accept as many connections as possible at once
    multi_accept on;
}

http {
    ##
    # Basic Settings
    ##
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # SECURITY: Hide Nginx version number (Don't tell hackers what you run)
    server_tokens off;

    # PERFORMANCE: Zero-copy file transfer (faster static files)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # TUNING: Timeouts (Aggressive timeouts help prevent Slowloris DoS attacks)
    keepalive_timeout 65;
    client_header_timeout 10;
    client_body_timeout 10;
    send_timeout 10;

    # SECURITY: Buffer Overflows & Large Body Prevention
    # Limit payload size here too (Double protection with your Go Gateway)
    client_max_body_size 10M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;

    ##
    # SSL Settings (Hardening)
    ##
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # PERFORMANCE: Cache SSL handshakes to reduce CPU usage
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    ##
    # Logging (Buffer logs to reduce disk I/O)
    ##
    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name localhost;

        # Redirect all HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on; # ENABLE HTTP/2
        server_name localhost;

        ssl_certificate /etc/ssl/certs/waf.crt;
        ssl_certificate_key /etc/ssl/private/waf.key;

        # Modern Cipher Suite (Strong Security)
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        ##
        # Security Headers (Browser Protection)
        ##
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # HSTS
        add_header X-Frame-Options DENY;           # Stop Clickjacking
        add_header X-Content-Type-Options nosniff; # Stop MIME Sniffing
        add_header X-XSS-Protection "1; mode=block"; # Browser XSS Filter

        location / {
            proxy_pass http://go_gateway:8080;

            # PROXY OPTIMIZATIONS
            proxy_http_version 1.1;
            proxy_set_header Connection ""; # Keep-alive connection to backend
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for the backend connection
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}