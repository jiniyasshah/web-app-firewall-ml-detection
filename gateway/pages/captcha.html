<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Security Check | {{DOMAIN}}</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
      body {
        background-color: #0f172a;
        color: #e2e8f0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        text-align: center;
        max-width: 600px;
        padding: 2.5rem 2rem;
        border: 1px solid #1e293b;
        border-radius: 12px;
        background: #1e293b;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      }
      h1 {
        color: #38bdf8;
        margin-top: 0;
        margin-bottom: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
      }
      p {
        color: #94a3b8;
        margin-bottom: 2rem;
        line-height: 1.5;
      }
      strong {
        color: #e2e8f0;
      }
      .g-recaptcha {
        display: inline-block;
        margin-bottom: 1.5rem;
      }
      button {
        padding: 0.75rem 1.5rem;
        cursor: pointer;
        background: #38bdf8;
        border: none;
        color: #0f172a;
        border-radius: 6px;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.2s ease;
        width: 100%;
        max-width: 304px; /* Matches the standard reCAPTCHA widget width */
      }
      button:hover {
        background: #0284c7;
        color: #ffffff;
      }
      .footer {
        margin-top: 2.5rem;
        font-size: 0.875rem;
        color: #64748b;
      }
      .icon {
        width: 32px;
        height: 32px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>
        <svg
          class="icon"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
          ></path>
        </svg>
        Security Check
      </h1>
      <p>
        High traffic detected on <strong>{{DOMAIN}}</strong>.<br />
        Please verify you are human to continue.
      </p>

      <form action="/_waf/verify" method="POST">
        <div class="g-recaptcha" data-sitekey="{{SITE_KEY}}"></div>
        <br />
        <input type="hidden" name="redirect_to" value="{{REDIRECT_TO}}" />
        <button type="submit">Verify & Continue</button>
      </form>

      <div class="footer">Protected by Minishield WAF</div>
    </div>
  </body>
</html>
